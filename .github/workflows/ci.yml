# CI — the lefthook gates run again on a clean machine on every pull request, so they run whether or not
# anyone remembers. Actions pinned to full commit SHAs (tag in the trailing comment); Dependabot keeps the
# pins current. Tests need no env and no network.
# The Bun version comes from .tool-versions (one file the laptop reads too) — never pin it here.
#
# Six jobs. Each one is a REQUIRED check in branch protection, or a red run is advice, not a lock.
# Security gates run in BASELINE mode: only findings a PR ADDS fail, so an existing project can switch them on
# today. Prove each one with a planted control before trusting a green.
# Daily at 06:17 UTC only the dependency scan runs: new advisories arrive on code nobody touched.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *" # daily dependency re-scan (trivy job only; every other job skips on schedule)
  # No push-to-main trigger: with strict branch protection the PR head is byte-identical to what lands
  # on main, so a push run re-bills the same tree.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bunx @biomejs/biome check src

  typecheck:
    name: Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  test:
    name: Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # whois_lookup and check_package_ownership's tests both depend on the whois binary
      # existing at a known path; the ubuntu-24.04 runner image doesn't ship it by default.
      - run: sudo apt-get update && sudo apt-get install -y whois
      - run: bun install --frozen-lockfile
      - run: bun test

  semgrep:
    name: Semgrep SAST
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # baseline mode needs the PR's base commit
      - name: Install Semgrep (pinned)
        run: pip install --quiet semgrep==1.151.0
      # Registry rules, no account. --error: findings fail the run. On a PR only findings the PR ADDS fail
      # (--baseline-commit); a manual run scans everything.
      - name: Semgrep (baseline on PRs)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            semgrep scan --config auto --error --timeout 15 --baseline-commit "$BASE_SHA" src/
          else
            semgrep scan --config auto --error --timeout 15 src/
          fi

  gitleaks:
    name: Secret Detection
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # whole history: a key committed once and deleted is still a leak
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$ASSET" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"
          curl -sSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ASSET}$" checksums.txt | sha256sum -c -
          tar -xzf "$ASSET" gitleaks
      # `gitleaks git` scans the whole history. Exit code decides.
      - run: ./gitleaks git . --no-banner --redact

  trivy:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Baseline: today's accepted findings live in .trivyignore.yaml — one entry per package (purl), each with a
      # reason and an expiry — so only NEW HIGH/CRITICAL findings fail. No file = nothing accepted.
      - name: Use the baseline file if present
        run: if [ -f .trivyignore.yaml ]; then echo "TRIVY_IGNOREFILE=.trivyignore.yaml" >> "$GITHUB_ENV"; fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true" # dev deps hide real findings; bundled dev deps ARE production code
        with:
          version: v0.74.0
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
      # Daily run only: REPORT medium+ findings in the run summary without blocking (new advisories on old code).
      - name: Report MEDIUM+ (daily, non-blocking)
        if: always() && github.event_name == 'schedule'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: fs
          scanners: vuln
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-report.txt
      - name: Add the report to the run summary
        if: always() && github.event_name == 'schedule'
        run: |
          { echo '### Daily dependency report (MEDIUM+)'; echo '```'; cat trivy-report.txt 2>/dev/null || echo 'no report'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
